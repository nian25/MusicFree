<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>短剧剧集</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <button onclick="location.href='index.html'">← 返回</button>
  <h2 id="pageTitle">剧集列表</h2>
  <button id="themeToggle">🌗</button>
</header>

<main>
  <div id="info"></div>
  <div class="video-list" id="episodes"></div>
  <div id="errorMsg" class="small-muted"></div>
</main>

<script src="app.js"></script>

<script>
document.getElementById('themeToggle').addEventListener('click', toggleTheme);

(async function init() {
  let book = getCurrentBook();
  const errEl = document.getElementById('errorMsg');
  if (!book) {
    // 如果 current_book 丢失，尝试用 last_play 回推
    const last = getHistory();
    if (last && last.book_id) {
      book = { book_id: last.book_id, title: last.title || '上次播放剧集' };
      // 不保存完整封面/intro，但至少可以继续
    }
  }

  if (!book) {
    document.getElementById('info').innerHTML = '<p class="small-muted">未选择短剧。请返回搜索页选择剧集。</p>';
    return;
  }

  document.getElementById('pageTitle').textContent = book.title || '剧集列表';
  document.getElementById('info').innerHTML = `
    <div class="card">
      <img src="${book.cover || ''}" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;200&quot; height=&quot;267&quot;></svg>'" />
      <div>
        <h3>${book.title}</h3>
        <p>${(book.intro || '').slice(0, 120)}</p>
      </div>
    </div>`;

  // 加载剧集列表
  try {
    const data = await fetchJSON(`${API_BASE}?book_id=${book.book_id}`);
    const epList = document.getElementById('episodes');
    epList.innerHTML = '';
    if (!data || data.code !== 200 || !Array.isArray(data.data) || data.data.length === 0) {
      errEl.textContent = '未能获取剧集列表。';
      return;
    }
    data.data.forEach(ep => {
      const btn = document.createElement('button');
      btn.textContent = ep.title;
      btn.addEventListener('click', () => {
        // 保存当前选中集并跳转到播放页
        localStorage.setItem('current_video', JSON.stringify(ep));
        location.href = 'player.html';
      });
      epList.appendChild(btn);
    });
  } catch (e) {
    errEl.textContent = '请求剧集列表失败：' + e.message;
  }
})();
</script>
</body>
</html>
